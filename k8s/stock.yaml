apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
  namespace: clinica-connect
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: stock
  template:
    metadata:
      labels:
        app: stock
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: stock
          image: ghcr.io/mendesfelipealmeida/clinica-connect-stock:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "src/services/stock/server.js"]
          ports:
            - containerPort: 3102
          envFrom:
            - configMapRef:
                name: clinica-connect-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3102
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3102
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stock
  namespace: clinica-connect
spec:
  selector:
    app: stock
  ports:
    - name: http
      port: 3102
      targetPort: 3102
