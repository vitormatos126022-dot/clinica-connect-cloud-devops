apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointments
  namespace: clinica-connect
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: appointments
  template:
    metadata:
      labels:
        app: appointments
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: appointments
          image: ghcr.io/mendesfelipealmeida/clinica-connect-appointments:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "src/services/appointments/server.js"]
          ports:
            - containerPort: 3101
          envFrom:
            - configMapRef:
                name: clinica-connect-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3101
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3101
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: appointments
  namespace: clinica-connect
spec:
  selector:
    app: appointments
  ports:
    - name: http
      port: 3101
      targetPort: 3101
