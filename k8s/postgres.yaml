apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: clinica-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: clinica-connect-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: clinica-connect
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
