name: CI/CD Clinica Connect

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/clinica-connect

jobs:
  test:
    name: Build, lint and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate Docker Compose
        run: docker compose config

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests without cluster
        run: kubectl apply --dry-run=client --validate=false -f k8s/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  publish:
    name: Publish container images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-gateway, appointments, stock, notifications]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && vars.ENABLE_K8S_DEPLOY == 'true'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Render manifests with commit images
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cp -R k8s rendered-k8s
          sed -i "s|ghcr.io/mendesfelipealmeida/clinica-connect-api-gateway:1.0.0|${IMAGE_PREFIX}-api-gateway:${GITHUB_SHA}|g" rendered-k8s/api-gateway.yaml
          sed -i "s|ghcr.io/mendesfelipealmeida/clinica-connect-appointments:1.0.0|${IMAGE_PREFIX}-appointments:${GITHUB_SHA}|g" rendered-k8s/appointments.yaml
          sed -i "s|ghcr.io/mendesfelipealmeida/clinica-connect-stock:1.0.0|${IMAGE_PREFIX}-stock:${GITHUB_SHA}|g" rendered-k8s/stock.yaml
          sed -i "s|ghcr.io/mendesfelipealmeida/clinica-connect-notifications:1.0.0|${IMAGE_PREFIX}-notifications:${GITHUB_SHA}|g" rendered-k8s/notifications.yaml

      - name: Apply rendered manifests
        run: kubectl apply -f rendered-k8s/
